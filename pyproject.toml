[project]
name = "pagotic-sdk"
version = "0.1.1"
description = "SDK Python no oficial para la pasarela de pagos PagoTIC"
authors = [{ name = "Alitux", email = "alitux@disroot.org" }]
maintainers = [{ name = "Alitux", email = "alitux@disroot.org" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["pagotic", "paypertic", "pagos", "payments", "sdk", "argentina"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
qr = ["segno>=1.6,<2.0"]

[tool.poetry]
packages = [{ include = "pagotic", from = "src" }]

[tool.poetry.group.dev.dependencies]
mypy = ">=1.14"
pre-commit = ">=4.0"
pytest = ">=8.3"
pytest-cov = ">=6.0"
python-dotenv = ">=1.0"
respx = ">=0.22"
ruff = ">=0.9"
segno = ">=1.6,<2.0"

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6,<2.0"
mkdocs-material = ">=9.5,<10.0"
mkdocstrings = { version = ">=1.0,<2.0", extras = ["python"] }
pymdown-extensions = ">=10.2,<12.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "N",
  "UP",
  "B",
  "SIM",
  "ARG",
  "C4",
  "PERF",
  "RUF",
  "PTH",
  "S",
]
ignore = [
  "S105", # hardcoded passwords in tests/fixtures
  "S106", # hardcoded passwords in function arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "ARG001", "ARG002"]
"examples/**" = ["S105", "S106", "T201"]
"docs/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: tests que requieren credenciales reales de PagoTIC (se saltean si faltan)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["pagotic"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = [
  "if TYPE_CHECKING:",
  "@overload",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
