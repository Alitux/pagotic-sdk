site_name: PagoTIC SDK para Python
site_description: SDK no oficial de PagoTIC para Python
site_author: Alitux
site_url: https://alitux.github.io/pagotic-sdk/
repo_url: https://github.com/Alitux/pagotic-sdk
repo_name: Alitux/pagotic-sdk
edit_uri: edit/main/docs/
copyright: >
  Paquete no oficial, mantenido por la comunidad.
  Mantenedor: Alitux — alitux@disroot.org · Licencia GPL-3.0-or-later

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: es
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Inicio: index.md
  - Instalación: instalacion.md
  - Configuración: configuracion.md
  - Inicio rápido: inicio-rapido.md
  - Guías:
      - Pagos: pagos.md
      - Distribución programada: distribucion.md
      - Medios de pago y QR: medios-de-pago.md
      - Importación masiva: importaciones.md
      - Suscripciones: suscripciones.md
      - Webhooks: webhooks.md
  - Errores: errores.md
  - Referencia de API: api.md
  - Desarrollo: desarrollo.md
